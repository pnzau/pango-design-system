<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Hover brightens or fills; press does nothing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-body);color:var(--text-body)}.pad{padding:16px}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{border-radius:var(--r-9);width:96px;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;font-size:9.5px;font-weight:700;font-family:var(--font-mono);line-height:1.35}.n{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);font-weight:600}</style>
</head><body class="pad"><div style="display:flex;flex-direction:column;gap:9px;font-size:12.5px">
<div style="display:flex;align-items:center;gap:10px"><button style="border:none;background:#0a8f5b;color:#fff;border-radius:10px;padding:0 18px;height:40px;font-weight:700;font-size:13.5px;font-family:inherit">Primary</button><button style="border:none;background:#0a8f5b;color:#fff;border-radius:10px;padding:0 18px;height:40px;font-weight:700;font-size:13.5px;filter:brightness(1.08);font-family:inherit">Primary hover</button><span class="n">filter: brightness(1.08)</span></div>
<div style="display:flex;align-items:center;gap:10px"><button style="border:1px solid #d6d6d4;background:#fff;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;font-family:inherit">Secondary</button><button style="border:1px solid #d6d6d4;background:#f6f6f4;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;font-family:inherit">Secondary hover</button><span class="n">background → --surface-hover</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="background:#e9f7ef;border:1px solid #c3e6d1;color:#0a7d50;border-radius:9px;padding:9px 11px;font-family:var(--font-mono);font-size:12px">Unit cell</div><div style="background:#e9f7ef;border:1px solid #c3e6d1;color:#0a7d50;border-radius:9px;padding:9px 11px;font-family:var(--font-mono);font-size:12px;filter:brightness(.97)">Cell hover</div><span class="n">filter: brightness(.97)</span></div>
<div class="n">No press state anywhere — no scale, no shift, no darken. Focus on inputs is a border swap to ink.</div>
</div></body></html>
