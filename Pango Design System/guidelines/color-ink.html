<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-body);color:var(--text-body)}.pad{padding:16px}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{border-radius:var(--r-9);width:96px;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;font-size:9.5px;font-weight:700;font-family:var(--font-mono);line-height:1.35}.n{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);font-weight:600}</style>
</head><body class="pad"><div class="sw"><div class="s" style="background:#0e0e0e;color:#fff"><span>--ink</span><span style="opacity:.75">#0e0e0e</span></div><div class="s" style="background:#1c1c1c;color:#fff"><span>--ink-2</span><span style="opacity:.75">#1c1c1c</span></div><div class="s" style="background:#1f1f1f;color:#fff"><span>--ink-3</span><span style="opacity:.75">#1f1f1f</span></div><div class="s" style="background:#000;color:#fff"><span>--black</span><span style="opacity:.75">#000</span></div><div class="s" style="background:linear-gradient(120deg,#0e0e0e,#1f1f1f);color:#fff;width:200px"><span>--surface-dark-gradient</span><span style="opacity:.75">120deg #0e0e0e → #1f1f1f</span></div></div></body></html>
