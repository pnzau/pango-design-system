<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-body);color:var(--text-body)}.pad{padding:16px}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{border-radius:var(--r-9);width:96px;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;font-size:9.5px;font-weight:700;font-family:var(--font-mono);line-height:1.35}.n{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);font-weight:600}</style>
</head><body class="pad"><div style="display:flex;gap:10px">
<div style="flex:1;background:#e9f7ef;border:1px solid #c3e6d1;border-radius:var(--r-9);padding:11px 12px;font-family:var(--font-mono)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:12px;color:#0a7d50">Paid</span><span style="width:8px;height:8px;border-radius:50%;background:#0a8f5b"></span></div><div style="font-size:9.5px;color:#0a7d50;opacity:.8;margin-top:8px">#0a8f5b · #e9f7ef · #c3e6d1</div></div><div style="flex:1;background:#fdf6e8;border:1px solid #f0dca6;border-radius:var(--r-9);padding:11px 12px;font-family:var(--font-mono)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:12px;color:#9a6b00">Due soon</span><span style="width:8px;height:8px;border-radius:50%;background:#d98a00"></span></div><div style="font-size:9.5px;color:#9a6b00;opacity:.8;margin-top:8px">#d98a00 · #fdf6e8 · #f0dca6</div></div><div style="flex:1;background:#fbecea;border:1px solid #f1c5c0;border-radius:var(--r-9);padding:11px 12px;font-family:var(--font-mono)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:12px;color:#b32a20">Overdue</span><span style="width:8px;height:8px;border-radius:50%;background:#d1382c"></span></div><div style="font-size:9.5px;color:#b32a20;opacity:.8;margin-top:8px">#d1382c · #fbecea · #f1c5c0</div></div>
<div style="flex:1;background:#fafafa;border:1px solid #e6e6e4;border-radius:var(--r-9);padding:11px 12px;font-family:var(--font-mono)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:12px;color:#8a8a8a">Vacant</span><span style="width:15px;height:15px;border-radius:5px;background:#fff;border:1.5px dashed #cfcfcf;box-sizing:border-box"></span></div><div style="font-size:9.5px;color:#8a8a8a;margin-top:8px">dashed outline, no fill</div></div>
</div></body></html>
