<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body class="pad"><div class="sw"><div class="s" style="background:#f4f4f3;color:#0e0e0e"><span>app bg / --grey-200</span><span style="opacity:.75">#f4f4f3</span></div><div class="s" style="background:#fafafa;color:#0e0e0e"><span>inset / --grey-50</span><span style="opacity:.75">#fafafa</span></div><div class="s" style="background:#f3f3f1;color:#0e0e0e"><span>chip / --grey-250</span><span style="opacity:.75">#f3f3f1</span></div><div class="s" style="background:#f6f6f4;color:#0e0e0e"><span>hover / --grey-100</span><span style="opacity:.75">#f6f6f4</span></div><div class="s" style="background:#ffffff;color:#0e0e0e"><span>card #fff</span><span style="opacity:.75">#ffffff</span></div></div></body></html>
