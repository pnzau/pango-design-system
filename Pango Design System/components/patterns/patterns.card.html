<!-- @dsCard group="Components" viewport="760x420" name="Tile grid" subtitle="Status tiles for a fixed inventory — dots and cells" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-body);color:var(--text-body)}#root{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.h{font:var(--text-section-title);margin-bottom:10px}.sub{font-size:var(--fs-11-5);color:var(--text-muted);margin-bottom:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TileGrid, StatusLegend, Card } = window.PangoDesignSystem_86a349;
const beds = [
  { label: 'WARD A', tiles: [{label:'A1',caption:'Otieno',status:'success'},{label:'A2',caption:'Mwangi',status:'warning'},{label:'A3',status:'empty'},{label:'A4',caption:'Njoroge',status:'success'}] },
  { label: 'WARD B', tiles: [{label:'B1',caption:'Kamau',status:'danger'},{label:'B2',status:'empty'},{label:'B3',caption:'Wanjiru',status:'success'},{label:'B4',caption:'Achieng',status:'success'}] }
];
const racks = [
  { label: 'R1', tiles: [{label:'1',status:'success'},{label:'2',status:'success'},{label:'3',status:'warning'},{label:'4',status:'success'},{label:'5',status:'empty'},{label:'6',status:'danger'}] },
  { label: 'R2', tiles: [{label:'1',status:'success'},{label:'2',status:'empty'},{label:'3',status:'success'},{label:'4',status:'success'},{label:'5',status:'success'},{label:'6',status:'warning'}] },
  { label: 'R3', tiles: [{label:'1',status:'warning'},{label:'2',status:'success'},{label:'3',status:'success'},{label:'4',status:'empty'},{label:'5',status:'empty'},{label:'6',status:'success'}] }
];
const legend = [{status:'success',label:'Occupied'},{status:'warning',label:'Discharging'},{status:'danger',label:'Attention'},{status:'empty',label:'Free'}];
function Demo(){return <React.Fragment>
  <Card padding={16}>
    <div className="h">Cells</div><div className="sub">Detail view — label, dot, one line of context</div>
    <StatusLegend items={legend} compact style={{marginBottom:12}}/>
    <TileGrid rows={beds} onTileClick={()=>{}} emptyCaption="Free"/>
  </Card>
  <Card padding={16}>
    <div className="h">Dots</div><div className="sub">Summary card — the same data, one line per row</div>
    <TileGrid rows={racks} variant="dots"/>
    <div style={{marginTop:14}}><StatusLegend items={[{status:'success',label:'Healthy'},{status:'warning',label:'Degraded'},{status:'danger',label:'Down'},{status:'empty',label:'Unracked'}]} compact/></div>
  </Card>
</React.Fragment>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
