<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-body);color:var(--text-body)}#root{padding:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { NavItem, SegmentedControl, PageHeader, Icon, Badge, Button, SearchField } = window.PangoDesignSystem_86a349;
function Demo(){const [s,setS]=React.useState('properties');const [r,setR]=React.useState('landlord');
const items=[['properties','Properties','properties',null],['billing','Rent & Invoices','invoice',null],['repairs','Repairs','repairs',<Badge style={{marginLeft:'auto'}}>11</Badge>],['vacancies','Vacancies','vacancies',null],['insights','AI Insights','sparkle',<Badge variant="flag" style={{marginLeft:'auto'}}>AI</Badge>]];
return <div style={{display:'grid',gridTemplateColumns:'248px 1fr',gap:18,alignItems:'start'}}>
  <div style={{background:'var(--surface-card)',border:'1px solid var(--border-card)',borderRadius:'var(--r-16)',padding:'14px 12px'}}>
    <div style={{display:'flex',flexDirection:'column',gap:3}}>{items.map(([k,label,icon,badge])=><NavItem key={k} active={s===k} onClick={()=>setS(k)} icon={<Icon name={icon}/>} badge={badge}>{label}</NavItem>)}</div>
    <div style={{height:1,background:'var(--border-inset)',margin:'8px 6px'}}></div>
    <SegmentedControl value={r} onChange={setR} options={[{value:'landlord',label:'Landlord'},{value:'manager',label:'Manager'}]}/>
  </div>
  <div style={{background:'var(--surface-app)',border:'1px solid var(--border-card)',borderRadius:'var(--r-16)',overflow:'hidden'}}>
    <PageHeader title="Properties" subtitle="4 properties across Nairobi" cta={<Button>Add property</Button>}><SearchField width={180}/></PageHeader>
    <div style={{height:120}}></div>
  </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
