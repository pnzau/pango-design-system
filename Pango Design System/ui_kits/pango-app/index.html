<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pango — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="login-screen.jsx"></script>
<script type="text/babel" src="properties-screen.jsx"></script>
<script type="text/babel" src="property-detail-screen.jsx"></script>
<script type="text/babel" src="billing-screen.jsx"></script>
<script type="text/babel" src="repairs-screen.jsx"></script>
<script type="text/babel" src="vacancies-screen.jsx"></script>
<script type="text/babel" src="verify-screen.jsx"></script>
<script type="text/babel" src="insights-screen.jsx"></script>
<script type="text/babel" src="managers-screen.jsx"></script>
<script type="text/babel">
function App(){
  const [authed,setAuthed]=React.useState(false);
  const [screen,setScreen]=React.useState('properties');
  const [propId,setPropId]=React.useState(null);
  const [role,setRole]=React.useState('landlord');
  if(!authed) return <LoginScreen onSignIn={()=>setAuthed(true)} />;
  const go=k=>{setPropId(null);setScreen(k)};
  let body;
  if(propId) body=<PropertyDetailScreen propId={propId} onBack={()=>setPropId(null)} />;
  else if(screen==='properties') body=<PropertiesScreen onOpenProperty={setPropId} onOpenInsights={()=>setScreen('insights')} />;
  else if(screen==='billing') body=<BillingScreen />;
  else if(screen==='repairs') body=<RepairsScreen />;
  else if(screen==='vacancies') body=<VacanciesScreen />;
  else if(screen==='verify') body=<VerifyScreen />;
  else if(screen==='insights') body=<InsightsScreen />;
  else body=<ManagersScreen />;
  return <Shell screen={screen} go={go} role={role} setRole={setRole} onSignOut={()=>setAuthed(false)}>{body}</Shell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
